<div class="book-card">

  <!-- Kitap kapağı -->
  <div class="book-cover">
    <img [src]="kitapFoto()" alt="Kitap kapağı">
  </div>

  <!-- Kitap bilgileri -->
  <div class="book-info">

    <div class="book-header">
      <h3>{{ kitapAdi() }}</h3>

      <!-- Bookmark -->
      <span class="bookmark">♡</span>
    </div>

    <p class="author">
      {{ yazar() }}
    </p>

    <p class="details">
      {{ basimYili() }}
      <span>•</span>
      {{ dil() }}
    </p>

    <!-- Durum -->
    <div
      class="status"
      [class.available]="raftaMi()"
      [class.borrowed]="!raftaMi()">

      <span>{{ raftaMi() ? '✓' : '◉' }}</span>
      {{ raftaMi() ? 'Rafta Var' : 'Ödünçte' }}

    </div>

    <!-- Fakülte -->
    <p class="faculty">
      <span class="location-icon">●</span>
      {{ fakulte() }}
    </p>

  </div>

</div>
