<div class="profile-information">

  <div class="profile-image">
    <img
      [src]="profile.profileImage"
      [alt]="profile.name"
    >
  </div>

  <div class="profile-details">
    <h3>{{ profile.name }}</h3>
    <p>{{ profile.studentNumber }}</p>
    <span>{{ profile.department }}</span>
  </div>

</div>
