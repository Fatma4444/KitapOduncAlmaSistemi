
<div class="profile-categories">

  <button type="button" class="category-card" (click)="borrowedBooks()">
    <span class="category-left">
      <span class="category-icon">📚</span>
      <span class="category-title">Ödünçteki Kitaplar</span>
    </span>
  </button>

  <button type="button" class="category-card" (click)="reservation()">
    <span class="category-left">
      <span class="category-icon">🔍</span>
      <span class="category-title">Rezervasyonlarım</span>
    </span>
  </button>

  <button type="button" class="category-card" (click)="myPastPage()">
    <span class="category-left">
      <span class="category-icon">📄</span>
      <span class="category-title">Geçmişim</span>
    </span>
  </button>

  <button type="button" class="category-card" (click)="favorite()">
    <span class="category-left">
      <span class="category-icon">♡</span>
      <span class="category-title">Favorilerim</span>
    </span>
  </button>

  

</div>
